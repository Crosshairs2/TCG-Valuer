<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Search Sets</title>
	<link rel="stylesheet" href="styles.css">
	<script>
			function searchSet() {
				const apiKey = 'b05aeb68-e6b4-4d3e-ab96-485c97244660';
				const outputText = document.getElementById('outputText');
				let search = document.getElementById('searchInput').value;
				fetch(`https://api.pokemontcg.io/v2/sets?q=name:${search}`, {
					headers: {
						'X-Api-Key': apiKey
					}
				}).then(response => {
					return response.json();
				}).then(sets => {
					let allResults = "";
					sets.data.forEach(set => {
						allResults += `<div>
							<div>Name: ${set.name}</div>
							<div>Printed Total: ${set.printedTotal}</div>
							<div>Total: ${set.total}</div>
							<div>ID: ${set.id}</div>
							<div>Symbol: <img src="${set.images.symbol}" width="50%"></div>
							<div>Logo: <img src="${set.images.logo}" width="50%"></div>
						</div>`;
					})
					outputText.innerHTML = allResults;
				});
			};
		</script>
</head>
<body>
	<header>
		<h1>Search Sets</h1>
		<nav>
			<ul>
				<li><a href="index.html">Home</a></li>
				<li><a href="search.html">Search Cards</a></li>
				<li><a href="searchSet.html">Search Sets</a></li>
				<li><a href="moreData.html">Extra Info</a></li>
			</ul>
		</nav>
	</header>
	<main>
		<section>
			<input id="searchInput" type="text" placeholder="Enter set name..." />
			<button onClick="searchSet()">Search Sets</button>
		</section>
		<section>
			<div class="flex-container" id="outputText"></div>
		</section>
	</main>
	<footer>
	</footer>
</body>
</html>
